  - id: AC-007
    title: "An unshowable half is read-only, not flattened"
    type: property
    test_ids:
      - tests/ui/recipe-unshowable.test.tsx::an unshowable record is read-only and byte-stable
      - e2e/editor-readonly.spec.ts::saving is blocked with a stated reason
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Byte-stability of the unreadable half across a real SAVE: serialise the half, open the record, save it, read the committed document back, require equality. Stronger than the original no-op-session version, and it had to be: saving is no longer blocked (amended 2026-08-08, because the block made a shipped slice record uneditable), so what a save writes has to be proved rather than prevented. The relation holds regardless of implementation and is exactly what a flatten violates — a maker that reduces a two-effect card to one passes every rendering assertion and fails this one."
    oracle_independence_waiver: null
    input_domain: "records with an undrawable half: two or more effects (the sentence half), or movement patterns outside the grid-plus-direction model (the grid half); the two are independent"
    transformation: "serialise the unreadable half, open the record in the maker, save it, read the committed record back"
    expected_relation: "unreadable_half(commit(save(open(r)))) == unreadable_half(r) and editor_absent_for(unreadable_half)"
    preconditions:
      - "the record validates under the current schema, i.e. it is a document that legitimately loads and plays"
    observable_output: "the committed record's unreadable half, and whether that half's editing controls rendered"
    generator_hint: "build the unshowable cases from bundled records by concatenating two of their effects"

  - id: AC-008
    title: "Keys are derived, not typed"
    type: property
    test_ids:
      # Corrected at wrapup: the PLAN named `rename-wiring.test.tsx` / `rename.test.ts`,
      # but the invariant was written as its own file. The pointers were stale, and
      # `pending_test: true` is why `cross_validate` rule 3 never caught it.
      - tests/ui/rename-invariant.test.tsx::a foreign-keyed record survives open-and-save unchanged
      - tests/ui/rename-invariant.test.tsx::offers no way to type a key
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Invariant: opening and saving a record without editing its name or text must not move its nameKey/textKey. This is implementation-independent and targets the exact hazard of removing the key fields — a derivation that fires unconditionally re-homes a record keyed in a foreign namespace, which is a recorded past failure of this repo's rename repair rather than a hypothetical."
    oracle_independence_waiver: null
    input_domain: "records whose nameKey/textKey are derived from their id, and records whose keys sit in a namespace unrelated to their id"
    transformation: "open the record in the maker and save it without editing name or description"
    expected_relation: "keys(save(open(r))) == keys(r)"
    preconditions:
      - "the record's strings resolve before the open, so a changed key would be observable as a dotted key"
    observable_output: "the record's nameKey and textKey after save"
    generator_hint: "include at least one record whose id namespace differs from its key namespace"


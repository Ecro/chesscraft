  - id: AC-002
    title: "The four grammar additions round-trip"
    type: property
    test_ids:
      - tests/ui/recipe-roundtrip.test.ts::every sentence shape reads back as itself
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Metamorphic identity over the sentence compiler: readRecipe(writeRecipe(s)) must equal s for every sentence the builder can express. The relation is stated over the builder's own inputs and outputs and shares no code with either direction, so a writer that drops the quantifier or a reader that ignores the second action breaks it regardless of implementation. This is the exact property whose absence would let a record be silently flattened."
    oracle_independence_waiver: null
    input_domain: "every sentence the builder can express: each trigger x each condition (including all/any over two leaves) x each action (including a two-target action) x each target, with the forEach quantifier present or absent and one or two actions"
    transformation: "write the sentence into a draft, then read the draft back into a sentence"
    expected_relation: "read(write(sentence)) == sentence"
    preconditions:
      - "the sentence's slots are all legal for the host content kind"
    observable_output: "the sentence read back from the draft"
    generator_hint: "enumerate the slot cross-product rather than sampling; the space is small enough to exhaust"


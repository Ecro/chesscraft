    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: differential
    oracle_evidence: "The same position is played twice on the same engine, once with the replacement card in play and once with no rule card; the control's outcome comes from code paths the card does not touch, so the difference isolates the card's clause. This is the idiom card-liveness.test.ts already uses for every shipped card."
    oracle_independence_waiver: null
    input_domain: "positions where the mover has a legal capture"
    transformation: "play the capture, once with the replacement rule card in play and once with no rule card"
    expected_relation: "board(with_card) == board(without_card) and frozen_until(destination, with_card) == ply_count + 2 and frozen_until(destination, without_card) is None"
    preconditions:
      - "the captured piece is not royal, so the ply is not short-circuited"
    observable_output: "the resolved board and frozenUntil map"
    generator_hint: null


  - id: AC-005
    title: "a `block_capture` grant protects only the side that created it"
    type: property
    test_ids: []
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Protection is owned by whoever created it — so the same square, same live grant, same attacker must yield opposite capture legality depending only on which side occupies it. The two arms differ in one bit that the implementation does not currently read, so a fix that merely deletes the grant early passes one arm and fails the other."
    oracle_independence_waiver: null
    input_domain: "positions with a live duration-bearing block_capture grant on a square whose occupant has changed since the grant was made"
    transformation: "generate the attacking side's moves with the grant's owner standing there, then with an enemy standing there"
    expected_relation: "capture_legal(enemy_occupant) == True and capture_legal(owner_occupant) == False"
    preconditions:
      - "the grant is still within its untilPly window in both arms"
      - "the attacker's geometry reaches the square in both arms"
    observable_output: "whether the capture appears in the legal-action list"

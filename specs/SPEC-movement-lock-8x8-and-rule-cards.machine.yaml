  - id: AC-012
    title: "a card that would relocate a royal leaves it where it stands"
    type: property
    test_ids: []
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: differential
    oracle_evidence: "Royal skill-immunity is total, so a relocation card naming a royal must leave the position identical to the no-card control on every observable — board, grants and legal actions alike. That equality is what immunity MEANS, and it is the pre-existing royal-skill-immunity suite's own premise, so a lock implementation that quietly widens mayAffect to make its own AC pass fails this one instead."
    oracle_independence_waiver: null
    input_domain: "positions where a relocation skill card's chosen target is a royal piece"
    transformation: "resolve the card, then generate the mover's legal actions"
    expected_relation: "board(after) == board(before) and grants(after) == grants(before) and moves_from(royal_square) == moves_from_without_card(royal_square)"
    preconditions:
      - "the effect's layer is 'skill'"
      - "the named target is royal"
    observable_output: "the board, the grants list, and the legal-action list"
    generator_hint: null


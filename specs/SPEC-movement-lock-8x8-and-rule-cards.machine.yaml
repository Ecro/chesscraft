    oracle_evidence: "Each new square is compared against the same ply played on an unpainted square — the control square shares the whole engine except the paint, so a square type that declares an effect and changes nothing shows up as an equality that should have been a difference. This is exactly the check square-liveness.test.ts was built for after square.geyser shipped inert."

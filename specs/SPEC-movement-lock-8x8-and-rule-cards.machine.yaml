ac:
  - id: AC-001
    title: "a teleported piece cannot take the move the turn still owes"
    type: property
    test_ids: []
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "A lock MEANS the locked square contributes no move actions — so the legal-action set after the card must equal the set the same generator produces for a position with that piece absent from consideration. That equality is a statement about what locking is, not about how the grant is stored, so it cannot be satisfied by reading the implementation."
    oracle_independence_waiver: null
    input_domain: "positions where a relocation card resolves and the mover has at least two mobile pieces"
    transformation: "resolve the card, then generate legal actions"
    expected_relation: "moves_from(locked_square) == [] and moves_from(every_other_square) == moves_from_without_lock(every_other_square)"
    preconditions:
      - "the card declares the relocation lock"
      - "the relocated piece survives the on_play cascade"
    observable_output: "the legal-action list"
    generator_hint: null


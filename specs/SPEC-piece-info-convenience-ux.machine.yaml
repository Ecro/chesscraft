  - id: AC-005
    title: "A piece too complex to draw says so instead of showing nothing"
    type: property
    test_ids:
      - tests/ui/piece-detail.test.tsx::every bundled piece renders either a grid or the undrawable notice
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Exactly-one-of is a totality relation over the whole bundled piece set: it is satisfiable only if the null branch of readGrid is handled, and it is falsified by the silent no-op this project's recorded absent-case failure mode produces. It holds independently of how the grid is rendered."
    oracle_independence_waiver: null
    input_domain: "every piece definition in the shipped content bundle, including those whose movement readGrid returns null for"
    transformation: "render the detail sheet for the piece and inspect what the movement region contains"
    expected_relation: "exactly one of {a 7x7 grid with at least one non-empty cell, the undrawable notice} is present; a rendered-but-empty grid satisfies neither"
    preconditions:
      - "the piece has a non-empty movement definition"
    observable_output: "the movement region's rendered kind"
    generator_hint: "enumerate the bundle rather than sampling, and include at least one multi-pattern and one mixed-travel-kind piece"


  - id: AC-008
    title: "The operating system does not eat the press"
    type: mechanical
    test_ids:
      - e2e/piece-info.spec.ts::a long press raises no system menu and leaves scrolling intact
      - tests/ui/touch-hardening.test.ts::suppresses the iOS callout and the selection handles together
    executable_predicate: "computed(square, '-webkit-touch-callout') == 'none' and computed(square, 'user-select') == 'none' and contextmenu_default_prevented(long_press) and scroll_offset(after_swipe) != scroll_offset(before_swipe)"
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: golden
    oracle_evidence: "The two CSS values are the documented WebKit remedy for the long-press callout and the selection loupe, pinned from the vendor bug report and Apple's own guidance rather than from this codebase; the scroll assertion pins a behaviour that exists today and must survive. Split across two tests because -webkit-touch-callout is iOS-only and is dropped at parse time by Playwright WebKit on Linux, so it is asserted on the source rather than on a computed value that can never carry it."
    oracle_independence_waiver: null
    input_domain: null
    transformation: null
    expected_relation: null
    preconditions: []
    observable_output: null
    generator_hint: null


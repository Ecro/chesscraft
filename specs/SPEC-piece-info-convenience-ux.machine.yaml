  - id: AC-003
    title: "A press that becomes a drag is a drag, never both"
    type: property
    test_ids:
      - tests/ui/press-gesture.test.tsx::a sequence never both opens the sheet and commits a move
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Mutual exclusion of the two commits is a relation over the input sequence and the pair of outcomes, holding for any threshold values and any handler structure; an implementation that fires both violates it regardless of how it is written, so the relation cannot be derived from the code it judges."
    oracle_independence_waiver: null
    input_domain: "pointer sequences over one square: pointerdown, zero or more pointermove events with arbitrary displacement, then pointerup or pointercancel, with arbitrary elapsed time"
    transformation: "dispatch the sequence at the board and observe which commits fired"
    expected_relation: "at most one of {detail sheet opened, move committed} occurs; and displacement exceeding the movement threshold before the press threshold elapses implies the sheet did not open"
    preconditions:
      - "a match is in progress and the pressed square is on the board"
    observable_output: "the pair (sheet_opened: bool, move_committed: bool)"
    generator_hint: "vary displacement across the movement threshold and hold duration across the press threshold, including exactly-at-threshold values"


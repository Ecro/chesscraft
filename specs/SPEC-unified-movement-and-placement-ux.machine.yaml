  - id: AC-004
    title: "A slide cell owns its ray, and the ray's length is per-direction"
    type: property
    test_ids:
      - tests/ui/movement-ray.test.ts::caps one direction without touching another
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "The relation is between the painted distance and the emitted cap, and it must hold for every direction and every distance independently — that independence is exactly the model widening under test, so a shared-cap implementation fails it for any pair of directions painted at different distances. The relation is stated over the compiler's output shape, which the compiler cannot define for itself."
    oracle_independence_waiver: null
    input_domain: "any two distinct compass directions d1, d2 and any reaches r1, r2 drawn from {1, 2, edge}; and the same direction on the two AXES at two different reaches"
    transformation: "paint the cell at reach r1 along d1 and the cell at reach r2 along d2 as slide, then save"
    expected_relation: "the saved movement contains a slide pattern along d1 carrying reach r1 and a slide pattern along d2 carrying reach r2, and r1 != r2 does not collapse either into a shared cap"
    preconditions:
      - "the grid is in the movement mode"
    observable_output: "the saved movement array"
    generator_hint: "include a pair where one reach is edge and the other is bounded, and a case where movement and attack cap the SAME direction differently — both were unrepresentable before this change"


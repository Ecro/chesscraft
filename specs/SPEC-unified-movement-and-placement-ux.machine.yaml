  - id: AC-002
    title: "A cell tap cycles through every state its square can hold, and comes back"
    type: property
    test_ids:
      - tests/ui/movement-cell-cycle.test.ts::a ray cell at (%i,%i) visits leap then ray then nothing
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Cyclic idempotence holds for any correct cycle regardless of how the cycle is coded, and it simultaneously pins the state COUNT at each square: a four-state cycle fails the round-trip and a two-state cycle fails the intermediate-state assertion. The implementation cannot satisfy it by agreeing with itself because the oracle is equality with the pre-tap grid, captured before any code under test runs. NOTE the comparison is over the GRID, not over writeGrid's output: in capture mode a grid with capture squares and no movement squares compiles to the same refusal before and after, so a writeGrid-based oracle passes by comparing one refusal to another."
    oracle_independence_waiver: null
    input_domain: "every cell of the 7x7 grid except the centre, in each of the two modes, split by whether the cell lies on one of the eight compass rays (24 do, 24 do not)"
    transformation: "tap the cell three times on a compass cell, twice off one"
    expected_relation: "the grid is deep-equal to its pre-tap value, and the intermediate states are exactly [step, slide, none] on a compass cell and [step, none] off one"
    preconditions:
      - "the piece draft opens in the grid rather than the refusal view"
      - "the tapped cell's direction carries no ray yet ON THE AXIS BEING EDITED — a cap belongs to a direction and an axis, so tapping a square of an EXISTING ray clears that ray and the third tap re-tips it at the tapped square, which does not round-trip and is asserted separately. The OTHER axis is never touched by a tap."
    observable_output: "the grid's cells, slides, reach and forward"
    generator_hint: "sweep all 48 non-centre cells x 2 modes rather than sampling, partitioned by rayOf(df,dr) !== null"


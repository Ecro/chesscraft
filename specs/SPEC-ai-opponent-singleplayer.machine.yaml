  - id: AC-002
    title: "The AI takes its own turns through the shared action pipeline"
    type: property
    test_ids:
      - tests/engine/ai-agent.test.ts::chosen action is always a member of legalActions
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Membership in legalActions is decided by the engine's own generator, which shares no code with the AI's selection logic; the relation holds for every selection strategy, so it cannot be satisfied by an AI that merely agrees with itself."
    oracle_independence_waiver: null
    input_domain: "reachable non-terminal GameStates across loadable content sets, including draft-pending and card-play states"
    transformation: "ask the AI for an action, then commit it with apply"
    expected_relation: "chosen in legalActions(state, content) and committed_state == apply(state, chosen, content)"
    preconditions:
      - "state.result is null"
      - "legalActions(state, content) is non-empty"
    observable_output: "an Action, and the GameState produced by applying it"
    generator_hint: "walk matches forward with mixed random and AI actions to reach varied phases"

  - id: AC-003
    title: "A seeded single-player match is reproducible"
    type: property
    test_ids:
      - tests/engine/ai-determinism.test.ts::same seed and difficulty replay to an identical action sequence
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "A self-equality relation across two independently constructed matches. It needs no reference value and no knowledge of what the AI should play, so it holds regardless of search quality and cannot be trivially satisfied by reading the search code."
    oracle_independence_waiver: null
    input_domain: "arbitrary 31-bit seeds paired with each of the three difficulty levels"
    transformation: "construct two independent matches from the same (seed, difficulty) and drive both with the same human action sequence"
    expected_relation: "the two AI action sequences are equal and the two final GameStates are equal"
    preconditions:
      - "the search is bounded by node count, not wall-clock"
      - "the content set is inside the calibrated complexity envelope of AC-011"
      - "the wall-clock safety valve did not trip during the match"
    observable_output: "the ordered list of AI actions and the final GameState"
    generator_hint: "vary machine load between the two runs to prove the bound is not time-based"


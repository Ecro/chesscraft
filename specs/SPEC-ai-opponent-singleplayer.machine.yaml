  - id: AC-006
    title: "The easiest level plays weakly, not brokenly"
    type: property
    test_ids:
      - tests/engine/ai-blunder-clamp.test.ts::easiest level never picks a king-losing action when a safe one exists
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "The king-losing predicate is computed by applying the opponent's replies through the engine, independent of the AI's own evaluation; a clamp implemented by agreeing with the evaluator would still fail this relation. Guards directly against the recorded unasserted-fixture-premise failure, where a degenerate agent satisfied a whole statistical file."
    oracle_independence_waiver: null
    input_domain: "states where at least one legal action permits a king capture on the opponent's immediate reply and at least one does not, crossed with all three difficulty levels"
    transformation: "ask each difficulty level for its action"
    expected_relation: "for every level, chosen is not in the set of actions that allow an immediate king capture in reply; and the easiest level's chosen action is the search's top-ranked action in more than 25% of turns"
    preconditions:
      - "a non-king-losing legal action exists"
    observable_output: "the chosen Action, and the rank distribution of chosen actions across a match"
    generator_hint: "construct positions directly with createPosition rather than searching for them in self-play"


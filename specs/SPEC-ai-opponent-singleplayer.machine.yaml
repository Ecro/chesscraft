  - id: AC-011
    title: "Content too expensive to search is refused, not endured"
    type: property
    test_ids:
      - tests/engine/ai-complexity.test.ts::the envelope classifies fixture content on both sides of the bound
      - e2e/single-player.spec.ts::over-budget content refuses single-player while hot-seat still starts
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "The envelope's verdict is checked against independently MEASURED search cost on the same fixtures, not against the score function that produced it - a classifier that disagrees with the measurement fails regardless of how it computes its score. The refusal half is observed through the browser, against content built to straddle the bound rather than sampled from what happens to ship."
    oracle_independence_waiver: null
    input_domain: "schema-valid content sets spanning both sides of the calibrated complexity bound, including wide card-target products and long-reach movement patterns"
    transformation: "score the content with the envelope, then attempt to start a single-player match and a hot-seat match with it"
    expected_relation: "content the envelope rejects cannot start single-player and surfaces a reason naming the offending content, while hot-seat still starts; content the envelope accepts starts single-player; and a search that trips the wall-clock valve returns its best action so far with the match marked non-reproducible"
    preconditions:
      - "the complexity bound has been calibrated from measurement"
    observable_output: "the envelope verdict, the refusal message, and the non-reproducible marking"
    generator_hint: "author fixtures deliberately just inside and just outside the bound rather than relying on bundled content"

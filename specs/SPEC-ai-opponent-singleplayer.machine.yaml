  - id: AC-008
    title: "Abandoning a match mid-search is clean"
    type: property
    test_ids:
      - e2e/single-player.spec.ts::confirm dialog appears mid-search and cancelling discards the result
      - tests/ui/ai-abort.test.tsx::an abandoned search never applies its action
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "The guard predicate is compared against match.states.length, the state the guard is about, rather than against a counter that correlates with it — this is the exact substitution recorded in failures.md as counter-as-proxy-for-a-state, where plyCount silently exempted a drafted-but-unmoved match."
    oracle_independence_waiver: null
    input_domain: "single-player matches with at least one applied action, interrupted at an arbitrary point during the AI's search"
    transformation: "activate a match-discarding control while the search is in flight, then confirm or dismiss"
    expected_relation: "the confirm dialog appears whenever match.states.length > 1; on confirm no action from the cancelled search appears in any subsequent match state; on dismiss the AI still produces its move"
    preconditions:
      - "the AI search has started and has not yet committed"
    observable_output: "presence of the confirm dialog, and the resulting match state history"
    generator_hint: "interrupt at several points within the search rather than only at its start"

  - id: AC-009
    title: "The AI does not see the future"
    type: property
    test_ids:
      - tests/engine/ai-information-boundary.test.ts::perturbing unrevealed future offers does not change the chosen action
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "A metamorphic relation whose discriminating power comes from the engine's own determinism: because every draft offer is derived from state.seed via rngFor, a search that simulated past a draft boundary would necessarily change its answer when only the unrevealed substream changes. No expected move is needed, and the relation cannot be satisfied by an AI that peeks."
    oracle_independence_waiver: null
    input_domain: "pairs of matches identical in every player-observable respect at the AI's turn, differing only in draft offers not yet revealed to either side"
    transformation: "score the root actions, and select, in each match of the pair"
    expected_relation: "the root-action score vector is exactly equal (same actions, same scores) at every difficulty level, and the argmax-selected action is equal at the hardest level"
    preconditions:
      - "the differing offers have not been revealed to either side at the moment of choice"
      - "the hardest level selects by argmax and draws no random number, so its selection is sampler-independent"
      - "each match is searched with a FRESH transposition table, and both positions are constructed directly rather than reached by replay - a table carried across a differing history would let path differences reach the scores and make exact equality unattainable for reasons unrelated to the property under test"
    observable_output: "the root-action score vector, and the chosen Action at the hardest level"
    generator_hint: "hold the visible state fixed and vary only the substream that feeds not-yet-drawn offers; assert exact score equality, since the projection makes scoring a pure function of observable state; do NOT assert the sampled action at the two temperature levels, whose own RNG substream necessarily differs with the seed"


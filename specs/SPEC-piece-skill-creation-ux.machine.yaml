  - id: AC-004
    title: "Opening and re-saving never changes what a piece does"
    type: property
    test_ids:
      - tests/ui/piece-grid-roundtrip.test.ts::read then write preserves legal destinations
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Metamorphic invariant over the reader's own accept set: the engine's destination set must be identical before and after a no-op edit. The engine shares no code with the grid compiler, so a compiler that silently drops a pattern or a forward flag cannot satisfy it by agreeing with itself."
    oracle_independence_waiver: null
    input_domain: "every piece record in the bundled, slice and gate6a content sets that the redesigned reader accepts"
    transformation: "read the record into the maker's grid model, write it back out, and load both records into the engine"
    expected_relation: "legal_destinations(write(read(r))) == legal_destinations(r) for all squares and both sides"
    preconditions:
      - "read(r) is not None — records the reader refuses are AC-011's subject, not this one"
    observable_output: "the set of (origin, destination, is_capture) triples the engine reports"
    generator_hint: "enumerate the bundled content sets rather than synthesising records"

  - id: AC-005
    title: "A jump piece opens in the grid and re-saves behaviourally identically"
    type: mechanical
    test_ids:
      - tests/ui/piece-jump-roundtrip.test.ts::a bundled jump piece survives a no-op edit behaviourally
    executable_predicate: "read_grid(bundled_knight) is not None and legal_destinations(resave(bundled_knight)) == legal_destinations(bundled_knight)"
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: differential
    oracle_evidence: "The pre-edit bundled knight record is the reference implementation: the engine is run against the original and the re-saved copy and the destination sets compared. Byte equality is deliberately not the oracle, because 'jump' and 'step' are behaviourally identical in reachFrom and the maker is permitted to normalise one to the other."
    oracle_independence_waiver: null
    input_domain: null
    transformation: null
    expected_relation: null
    preconditions: []
    observable_output: null
    generator_hint: null


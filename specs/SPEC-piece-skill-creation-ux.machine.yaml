  - id: AC-008
    title: "Every vocabulary entry stays reachable, from an always-open expert tab"
    type: property
    test_ids:
      - tests/editor/vocabulary-coverage.test.ts::every vocabulary entry has a control that round-trips it
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Universal quantification over enumerateVocabulary(), which is derived from the Zod schemas rather than from the control table. The gate therefore cannot drift with the controls it checks — adding a control without a vocabulary entry, or an entry without a control, both fail."
    oracle_independence_waiver: null
    input_domain: "every entry returned by enumerateVocabulary(), plus the new slide-direction and reach-cap controls"
    transformation: "insert the entry via its control, read the record back through the control, and compare"
    expected_relation: "for every entry e, exists a control c such that read(c.make(e)) preserves e"
    preconditions:
      - "the expert tab is reachable without the simple maker having refused anything"
    observable_output: "the reconstructed vocabulary entry"
    generator_hint: "enumerate the schema, never a hand-written row list"

  - id: AC-009
    title: "The maker opens on a gallery, and a remix does not mutate its source"
    type: property
    test_ids:
      - tests/ui/piece-gallery-remix.test.tsx::a remix leaves its source record untouched
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "A non-mutation invariant stated over the stored document, not over the remix implementation: the source record must be byte-identical before and after, and the new id must differ. It holds for any correct remix and fails for the recorded import-then-edit overwrite bug regardless of how remix is coded."
    oracle_independence_waiver: null
    input_domain: "every piece record offered in the gallery"
    transformation: "open the record via 'make one like this', save the resulting draft, and re-read the document"
    expected_relation: "document[source_id] is unchanged and new_id != source_id"
    preconditions:
      - "the gallery is the maker's default view and a blank piece is one of its options"
    observable_output: "the serialised content document"
    generator_hint: "enumerate the gallery's own offer list"


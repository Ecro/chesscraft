ac:
  - id: AC-001
    title: "A lit grid cell is exactly one reachable square"
    type: property
    test_ids:
      - tests/ui/piece-grid-reach.test.ts::lit offsets equal reachable squares on an empty board
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "Metamorphic identity: compiling a lit-cell set and then computing reach must return that same offset set. The relation is stated over the grid's inputs and the engine's outputs and shares no code with the compiler, so a compiler that emits an unbounded slide breaks it regardless of how it is written."
    oracle_independence_waiver: null
    input_domain: "any subset of the 48 non-centre offsets in the 7x7 grid, each carrying move, capture, or both, with no slide direction enabled"
    transformation: "compile the grid to movement patterns, place the piece on an empty board far from every edge, and compute its reach with the engine"
    expected_relation: "reachable_offsets(compile(cells)) == set(cells.keys())"
    preconditions:
      - "at least one cell carries move or both, so the compiler does not reject the draft"
      - "the origin square is at least 3 squares from every edge, so no offset is clipped"
    observable_output: "the set of destination offsets the engine reports"
    generator_hint: "vary cell count from 1 to 48 and mix the three cell values"

  - id: AC-002
    title: "A slide direction with a reach cap produces exactly that many squares"
    type: parametric
    test_ids:
      - tests/ui/piece-slide-reach.test.ts::each reach setting yields its exact square count per direction
    executable_predicate: null
    golden_table:
      - input: { board: "6x6", origin: "c3", direction: "N", reach: "1" }
        expected: ["c4"]
      - input: { board: "6x6", origin: "c3", direction: "N", reach: "2" }
        expected: ["c4", "c5"]
      - input: { board: "6x6", origin: "c3", direction: "N", reach: "edge" }
        expected: ["c4", "c5", "c6"]
      - input: { board: "6x6", origin: "c3", direction: "NE", reach: "1" }
        expected: ["d4"]
      - input: { board: "6x6", origin: "c3", direction: "NE", reach: "2" }
        expected: ["d4", "e5"]
      - input: { board: "6x6", origin: "c3", direction: "NE", reach: "edge" }
        expected: ["d4", "e5", "f6"]
      - input: { board: "6x6", origin: "c3", direction: "E", reach: "edge" }
        expected: ["d3", "e3", "f3"]
      - input: { board: "6x6", origin: "c3", direction: "S", reach: "edge" }
        expected: ["c2", "c1"]
    rubric_id: null
    pending_test: true
    oracle_source: golden
    oracle_evidence: "The expected counts are derived from board geometry alone — a 6x6 board with the piece at c3 — and were written down before the reach control exists. They come from counting squares on a diagram, not from running the compiler."
    oracle_independence_waiver: null
    input_domain: null
    transformation: null
    expected_relation: null
    preconditions: []
    observable_output: null
    generator_hint: null


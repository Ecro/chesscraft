    oracle_evidence: "The test set is derived from the reader's own rejections rather than hand-picked, and the invariant — stored movement unchanged after a refused open — is a non-mutation property that holds for any correct refusal path. It fails precisely on the flatten-on-open regression it exists to prevent."
    oracle_independence_waiver: null
    input_domain: "every synthesised piece record for which the redesigned reader returns null, including two slide patterns with differing reach caps"

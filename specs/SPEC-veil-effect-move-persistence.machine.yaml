  - id: AC-001
    title: "durationed capture protection follows a normal move"
    type: property
    test_ids:
      - "tests/engine/grant-relocation.test.ts::AC-001 durationed capture protection follows a normal move"
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: true
    oracle_source: property
    oracle_evidence: "The card text defines protection over the chosen piece, while a legal move independently defines its destination; therefore exactly one live protection must move from origin to destination regardless of storage implementation."
    oracle_independence_waiver: null
    input_domain: "legal non-royal piece moves from a protected occupied origin to an in-bounds destination"
    transformation: "apply the legal move to a state with one live durationed block_capture grant on the mover"
    expected_relation: "matching_grants(after, destination) == matching_grants(before, origin) and matching_grants(after, origin) == [] and destination_is_protected(after)"
    preconditions:
      - "the grant beneficiary side matches the moving piece"
      - "the moving piece survives on the destination"
    observable_output: "grants array and legal capture actions"
    generator_hint: "Generate bounded legal positions with one attacker, one covered mover, and kings outside the interaction."


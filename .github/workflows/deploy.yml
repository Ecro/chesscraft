# Check, then publish — in that order, with no way to reach the second without the first.
#
# The repository had no CI at all before this, which meant the checks ran wherever someone
# remembered to run them. That is a gate in name only. Here the deploy step is a separate
# job that `needs: check`, so a red suite does not produce a partial deploy or a deploy at
# all; GitHub simply never starts the second job.
#
# Two jobs rather than two steps in one, deliberately. In a single job a
# `continue-on-error` left on a test step, or a later refactor that reorders steps,
# silently reconnects the two. `needs:` is a dependency the workflow file cannot express
# incorrectly by accident.
#
# ## What this gate does NOT run, and what that costs
#
# It runs `npm run verify:ci` — typecheck, build, unit tests, build-output tests — and
# NOT the two Playwright suites, which `npm run verify` still runs locally. That is a
# deliberate narrowing for CI speed (the browser install plus both suites is roughly 5
# minutes of the 6), and the cost is specific rather than theoretical:
#
#   jsdom does not enforce visibility and Playwright does. A control moved behind a
#   `hidden` container keeps every unit test green while being unreachable to a real
#   user — four regressions shipped that way in this repo before the e2e suite existed
#   (`[fail:test] jsdom-visibility-blind-spot`). Nothing in this workflow can catch that
#   class any more.
#
# So the e2e suites are now a LOCAL gate, not a deploy gate. Run `npm run verify` before
# pushing anything that touches UI reachability, layout, service-worker behaviour, or a
# `data-testid` some spec drives. If you want the browser gate back in CI, restore the
# `npx playwright install --with-deps chromium webkit` step and swap `verify:ci` for
# `verify` — that pairing is the whole change, and the install list is coupled to the
# `projects` in `playwright.config.ts` (a project naming an engine that is not installed
# fails as dozens of broken tests rather than one missing download).
name: deploy

on:
  push:
    branches: [master]
  # Runs the gate on proposed changes without ever reaching the deploy job, which is
  # skipped outside `master` by the `if` below.
  pull_request:
    branches: [master]
  # Re-deploy what is already on master, without inventing a commit to do it.
  #
  # This DOES reach the deploy job — see the `if` below — and that is the point. A
  # dispatch that only ran the checks would be the more cautious-looking choice and would
  # test strictly less: the deploy job is where the Cloudflare credentials are used, so a
  # button that skips it can be green with a wrong or absent token. The cases this exists
  # for are re-running a deploy after rotating a secret, and re-publishing after a
  # Cloudflare-side failure — neither of which involves a code change.
  workflow_dispatch:

# A second push while the first is still deploying would race two `wrangler deploy` calls
# at the same Worker. Newer wins; the older is cancelled before it can publish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A SCRIPT, not a list of steps here. CI listing its own steps is how CI and the
      # local gate drift, and the one that drifts is always the one nobody runs by hand.
      # `verify:ci` sits directly beneath `verify` in package.json so the narrowing is
      # visible in one place rather than inferred by diffing this file against that one.
      - run: npm run verify:ci

      # `verify:ci` already built. Handing `dist/` to the deploy job means the bytes that
      # get published are the exact bytes the checks passed against, rather than the
      # output of a second build that nothing checked.
      #
      # That is only true because `verify:ci` runs `test:build` LAST, after `build`. Keep
      # that order: the build-output assertions must see the artifact this uploads.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: check
    # Pull requests run the gate and stop here. Only `master` publishes — whether it got
    # here from a push or from the manual button, both of which can only be on `master`
    # anyway (the `push` trigger is branch-filtered, and a dispatch runs on the branch it
    # was launched from, so the ref check is what keeps a dispatch from another branch out).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # `npx wrangler deploy`, not `npm run deploy` — that script rebuilds first, which
      # would discard the checked artifact downloaded above and publish something no
      # suite has seen. The script exists for a human deploying from a laptop, where
      # rebuilding IS the safe default.
      #
      # The token must be a scoped Workers-deploy token, never an account-global API key:
      # this is the one credential in the repository and its blast radius is whatever
      # scope it was minted with.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
